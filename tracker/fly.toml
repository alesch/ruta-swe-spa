# fly.toml app configuration file generated for ruta-swe-spa-tracker on 2026-09-27T04:15:07+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ruta-swe-spa-tracker'
primary_region = 'arn'

[build]
[[mounts]]
  source = 'trackerdata'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
