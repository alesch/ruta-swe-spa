<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Route Sweden → Spain</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body, #map { height: 100%; margin: 0; }
  .pin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 3px rgba(0,0,0,.6); }
  .pin.start { background: #2ecc40; }
  .pin.end { background: #111; }
  .pin.place { width: 16px; height: 16px; background: #0074d9; border-radius: 3px; transform: rotate(45deg); }
</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="routes.js"></script>
<script>
const map = L.map('map').setView([50, 5], 5);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

const all = [];

ROUTES.forEach(r => {
  const line = L.polyline(r.path, { color: r.color, weight: 5, opacity: 0.85 }).addTo(map);
  line.bindTooltip(r.name, { sticky: true });

  r.waypoints.forEach(w => {
    const role = w.role || 'via';
    if (role === 'via') {
      L.circleMarker([w.lat, w.lon], { radius: 4, color: r.color, fillColor: '#fff', fillOpacity: 1, weight: 2 })
        .bindTooltip(w.name).addTo(map);
    } else {
      const icon = L.divIcon({ className: '', html: `<div class="pin ${role}"></div>`, iconSize: [14, 14], iconAnchor: [7, 7] });
      L.marker([w.lat, w.lon], { icon }).bindTooltip(w.name).addTo(map);
    }
  });

  all.push(line);
});

PLACES.forEach(p => {
  const icon = L.divIcon({ className: '', html: '<div class="pin place"></div>', iconSize: [16, 16], iconAnchor: [8, 8] });
  L.marker([p.lat, p.lon], { icon })
    .bindTooltip(`${p.name}, ${p.country}`, { permanent: true, direction: 'right', offset: [10, 0] })
    .addTo(map);
});

map.fitBounds(L.featureGroup(all).getBounds(), { padding: [30, 30] });
</script>
</body>
</html>
