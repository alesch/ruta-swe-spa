<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Route Sweden → Spain</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  html, body, #map { height: 100%; margin: 0; }
  .pin.end { width: 26px; height: 26px; border-radius: 50%; background: #fff; border: 2px solid #111;
             box-shadow: 0 0 3px rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center;
             color: #111; font-size: 14px; }
  .checkin.pause { width: 10px; height: 10px; border-radius: 50%; background: #ff9f1c;
                   border: 2px solid #fff; box-shadow: 0 0 3px rgba(0,0,0,.6); }
  .checkin.night { width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 2px solid #111;
                   box-shadow: 0 0 3px rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center;
                   color: #111; font-size: 9px; }
</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([50, 5], 5);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

const END = { name: 'Málaga', lat: 36.7213, lon: -4.4213 };
const endIcon = L.divIcon({ className: '', html: '<div class="pin end"><i class="fa-solid fa-flag-checkered"></i></div>', iconSize: [26, 26], iconAnchor: [13, 13] });
L.marker([END.lat, END.lon], { icon: endIcon }).bindTooltip(END.name).addTo(map);

map.setView([END.lat, END.lon], 5);

const TRACKER_API = 'https://ruta-swe-spa-tracker.fly.dev/api/checkins';
const checkinLayer = L.layerGroup().addTo(map);
let hasFitBounds = false;

function loadCheckins() {
  fetch(TRACKER_API)
    .then(r => r.json())
    .then(checkins => {
      checkinLayer.clearLayers();
      const sorted = [...checkins].sort((a, b) => new Date(a.ts) - new Date(b.ts));
      let nightCount = 0;
      sorted.forEach(c => {
        if (c.kind === 'night') {
          nightCount++;
          const icon = L.divIcon({ className: '', html: '<div class="checkin night"><i class="fa-solid fa-bed"></i></div>', iconSize: [16, 16], iconAnchor: [8, 8] });
          L.marker([c.lat, c.lon], { icon })
            .bindTooltip(`Night #${nightCount}`)
            .addTo(checkinLayer);
        } else {
          const icon = L.divIcon({ className: '', html: '<div class="checkin pause"></div>', iconSize: [10, 10], iconAnchor: [5, 5] });
          L.marker([c.lat, c.lon], { icon }).addTo(checkinLayer);
        }
      });
      if (!hasFitBounds && sorted.length > 0) {
        hasFitBounds = true;
        const points = [[END.lat, END.lon], ...sorted.map(c => [c.lat, c.lon])];
        map.fitBounds(L.latLngBounds(points), { padding: [30, 30] });
      }
    })
    .catch(() => { /* tracker offline or unreachable: keep showing the static map */ });
}

loadCheckins();
setInterval(loadCheckins, 60000);
</script>
</body>
</html>
