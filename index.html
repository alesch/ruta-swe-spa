<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Routes</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
  #app { display: flex; height: 100%; }
  #side { width: 300px; overflow-y: auto; padding: 12px; box-sizing: border-box; background: #fafafa; border-right: 1px solid #ddd; }
  #side h1 { font-size: 18px; margin: 0 0 4px; }
  #side p.hint { font-size: 12px; color: #666; margin: 0 0 12px; }
  .route { border-left: 5px solid var(--c); background: #fff; margin-bottom: 8px; padding: 8px 10px; border-radius: 4px; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .route.off { opacity: .4; }
  .route h2 { font-size: 14px; margin: 0; display: flex; justify-content: space-between; align-items: center; }
  .route .meta { font-size: 12px; color: #666; }
  .route .sum { font-size: 12px; margin-top: 4px; }
  .route label { font-size: 12px; font-weight: normal; }
  #map { flex: 1; }
  .pin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 3px rgba(0,0,0,.6); }
  .pin.start { background: #2ecc40; }
  .pin.end { background: #111; }
  .pin.place { width: 16px; height: 16px; background: #0074d9; border-radius: 3px; transform: rotate(45deg); }
  .pin.pass { background: #fff; border: 3px solid var(--c); }
  @media (max-width: 700px) {
    #app { flex-direction: column-reverse; }
    #side { width: auto; height: 40%; border-right: 0; border-top: 1px solid #ddd; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <h1>Routes</h1>
    <p class="hint">Green = start, black = end. Click a route to zoom.</p>
    <div id="list"></div>
  </div>
  <div id="map"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="routes.js"></script>
<script>
const map = L.map('map').setView([46.6, 9.5], 7);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

const list = document.getElementById('list');
const all = [];

ROUTES.forEach(r => {
  const group = L.featureGroup().addTo(map);
  const line = L.polyline(r.path, { color: r.color, weight: 5, opacity: 0.85 }).addTo(group);
  line.bindTooltip(r.name, { sticky: true });

  r.waypoints.forEach(w => {
    const role = w.role || 'via';
    if (role === 'via') {
      L.circleMarker([w.lat, w.lon], { radius: 4, color: r.color, fillColor: '#fff', fillOpacity: 1, weight: 2 })
        .bindTooltip(w.name).addTo(group);
    } else {
      const icon = L.divIcon({ className: '', html: `<div class="pin ${role}" style="--c:${r.color}"></div>`, iconSize: [14, 14], iconAnchor: [7, 7] });
      L.marker([w.lat, w.lon], { icon }).bindTooltip(w.name).addTo(group);
    }
  });

  const el = document.createElement('div');
  el.className = 'route';
  el.style.setProperty('--c', r.color);
  el.innerHTML = `
    <h2>${r.name}<label><input type="checkbox" checked> show</label></h2>
    <div class="meta">${r.country}${r.km ? ' · ~' + r.km + ' km' : ''}</div>
    <div class="sum">${r.summary}</div>`;
  const cb = el.querySelector('input');
  cb.addEventListener('click', e => e.stopPropagation());
  cb.addEventListener('change', () => {
    el.classList.toggle('off', !cb.checked);
    cb.checked ? group.addTo(map) : map.removeLayer(group);
  });
  el.addEventListener('click', () => {
    if (!cb.checked) { cb.checked = true; cb.dispatchEvent(new Event('change')); }
    map.fitBounds(line.getBounds(), { padding: [40, 40] });
  });
  list.appendChild(el);
  all.push(line);
});

PLACES.forEach(p => {
  const icon = L.divIcon({ className: '', html: '<div class="pin place"></div>', iconSize: [16, 16], iconAnchor: [8, 8] });
  L.marker([p.lat, p.lon], { icon })
    .bindTooltip(`${p.name}, ${p.country}`, { permanent: true, direction: 'right', offset: [10, 0] })
    .addTo(map);
});

map.fitBounds(L.featureGroup(all).getBounds(), { padding: [30, 30] });
</script>
</body>
</html>
